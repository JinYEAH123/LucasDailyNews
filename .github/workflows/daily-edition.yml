name: Daily edition

# Publishes at 5:00 PM Vancouver time, covering the previous 24 hours.
# GitHub cron is UTC and does not follow daylight saving, so both candidate
# hours fire and the job itself checks the local clock. Whichever run lands on
# 5 PM Vancouver does the work; the other exits in a few seconds.
on:
  schedule:
    - cron: '0 0 * * *'   # 17:00 Vancouver while PDT (UTC-7)
    - cron: '0 1 * * *'   # 17:00 Vancouver while PST (UTC-8)
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Blank = the current window.'
        required: false
      force:
        description: 'Regenerate even if that edition already exists'
        type: boolean
        default: false
      skip_email:
        description: 'Build the edition but do not send the newsletter'
        type: boolean
        default: false

concurrency:
  group: daily-edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check the Vancouver clock
        id: clock
        run: |
          hour=$(TZ=America/Vancouver date +%-H)
          echo "Vancouver time is now $(TZ=America/Vancouver date)"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run — proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
          elif [ "$hour" -ge 17 ] && [ "$hour" -le 18 ]; then
            # The window tolerates GitHub's cron delay, which can run to an hour.
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not the 5 PM run (hour=$hour) — skipping."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.clock.outputs.go == 'true'

      - uses: actions/setup-python@v5
        if: steps.clock.outputs.go == 'true'
        with:
          python-version: '3.12'

      - name: Install dependencies
        if: steps.clock.outputs.go == 'true'
        run: |
          pip install --quiet anthropic segno playwright opencv-python-headless
          playwright install --with-deps chromium
          # Chromium ships no CJK glyphs; without these the Chinese poster
          # renders as tofu boxes and nobody notices until it is posted.
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Generate today's edition
        if: steps.clock.outputs.go == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/generate_edition.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      # Before render_site, so the edition page can link to the finished image.
      - name: Build the share images
        if: steps.clock.outputs.go == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          python3 scripts/build_poster.py --both \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Render the site
        if: steps.clock.outputs.go == 'true'
        run: python3 scripts/render_site.py

      # Allowed to fail without losing the edition: the commit step below still
      # runs, so a mail outage costs a delivery, never a day's work. The job is
      # failed at the very end so the red run is still visible.
      - name: Send the newsletter
        id: send
        if: steps.clock.outputs.go == 'true' && !inputs.skip_email
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -z "${SMTP_HOST}" ] || [ -z "${NEWSLETTER_RECIPIENTS}" ]; then
            echo "Email is not configured yet — skipping. See the README to set it up."
            exit 0
          fi
          python3 scripts/send_newsletter.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit and push
        if: steps.clock.outputs.go == 'true'
        run: |
          git config user.name  "lucas-daily-news[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed — the edition was already published."
            exit 0
          fi
          git commit -m "Edition for $(TZ=America/Vancouver date +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed, retry $attempt"
            sleep $((2 ** attempt))
          done
          echo "Could not push after 4 attempts" >&2
          exit 1

      - name: Surface a failed send
        if: steps.send.outcome == 'failure'
        run: |
          echo "The edition was built and pushed, but the newsletter did not go out." >&2
          exit 1
