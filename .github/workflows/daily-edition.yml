name: Daily edition

# The publish time is a family setting (any zone, any hour), so the job still
# decides for itself whether an edition is due — which is what makes daylight
# saving a non-event. What changed is how often it asks.
#
# This used to be '0 * * * *'. GitHub does not honour that. Measured over 224
# hours in November, the hourly cron fired 3.2 times a day: median gap 8.1
# hours, worst 12.3. Roughly seven of every eight scheduled runs never happen,
# and GitHub throttles frequent schedules hardest, so asking for 24 is part of
# why so few arrive.
#
# With three runs a day drawn from 24 evenly spread hours, most land before the
# noon cutoff and exit as not-due — which is exactly what happened on
# 2026-11-24, when the day's only run came at 09:22 local and the paper was
# still missing at dinner.
#
# So ask for six times instead, all of them after a noon cutoff and spread
# across the afternoon and evening. Whichever few GitHub actually serves, each
# one is a run that can publish.
#
# The times are UTC, and they are chosen to stay after a noon cutoff whatever
# the zone does. At UTC-7 — which is where America/Vancouver now sits all year,
# tzdata having relabelled it MST from November 2026 when British Columbia
# stopped falling back — they are 13:10, 15:10, 17:10, 19:10, 21:10 and 23:10
# local. An hour earlier if a zone ever returns to UTC-8, which is still past
# noon. Nothing here reads the offset: the job asks appconfig, which asks the
# zone database, so a rule change costs nothing but a different label.
on:
  schedule:
    - cron: '10 20 * * *'
    - cron: '10 22 * * *'
    - cron: '10 0 * * *'
    - cron: '10 2 * * *'
    - cron: '10 4 * * *'
    - cron: '10 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Edition date (YYYY-MM-DD). Blank = the current window.'
        required: false
      force:
        description: 'Regenerate even if that edition already exists'
        type: boolean
        default: false
      skip_email:
        description: 'Build the edition but do not send the newsletter'
        type: boolean
        default: false

concurrency:
  group: daily-edition
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is this edition due?
        id: due
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import sys, pathlib, datetime
          sys.path.insert(0, "scripts")
          import appconfig

          cfg = appconfig.load()
          now = datetime.datetime.now(cfg.tz)
          date_str, _, _ = appconfig.resolve_window(cfg)
          already = pathlib.Path(f"data/editions/{date_str}.json").exists()

          # Due once the cutoff has passed and today's edition is still missing.
          # Stating it that way makes the job self-healing: if the run at the
          # cutoff hour is delayed or dropped — GitHub's scheduler makes no
          # promises — the next hourly run picks the day up instead of losing it.
          due = now.hour >= cfg.hour and not already

          print(f"go={'true' if due else 'false'}")
          print(f"date={date_str}")
          print(f"local={now:%Y-%m-%d %H:%M} {cfg.timezone}", file=sys.stderr)
          print(f"cutoff={cfg.hour:02d}:00  already_published={already}  due={due}",
                file=sys.stderr)
          PY

      - name: Install dependencies
        if: steps.due.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          pip install --quiet anthropic jsonschema segno playwright opencv-python-headless
          playwright install --with-deps chromium
          # Chromium ships no CJK glyphs; without these a Chinese poster renders
          # as tofu boxes and nobody notices until it is posted.
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Generate the edition
        if: steps.due.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 scripts/generate_edition.py \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.force && '--force' || '' }}

      # Before render_site, so the edition page can link the finished image.
      #
      # Allowed to fail for the same reason the newsletter is, and it took two
      # days to learn it: on 2026-11-15 and 2026-11-16 the edition generated
      # cleanly and was paid for, the QR self-check then refused one poster,
      # and because this step was fatal the job died before the commit below —
      # throwing away a finished edition twice over a share image.
      #
      # The paper is the product; the poster is a convenience. render_site only
      # links posters that exist, so a missing one degrades to a page without a
      # share button, which is a much smaller loss than a missing day.
      - name: Build the share images
        id: poster
        if: steps.due.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python3 scripts/build_poster.py --both \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Render the site
        if: steps.due.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
        run: python3 scripts/render_site.py

      # Allowed to fail without losing the edition: the commit step below still
      # runs, so a mail outage costs a delivery, never a day's work. The job is
      # failed at the very end so the red run is still visible.
      - name: Send the newsletter
        id: send
        if: >-
          (steps.due.outputs.go == 'true' || github.event_name == 'workflow_dispatch')
          && !inputs.skip_email
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          NEWSLETTER_RECIPIENTS: ${{ secrets.NEWSLETTER_RECIPIENTS }}
        run: |
          if [ -z "${SMTP_HOST}" ] || [ -z "${NEWSLETTER_RECIPIENTS}" ]; then
            echo "Email is not configured yet — skipping. See the README to set it up."
            exit 0
          fi
          python3 scripts/send_newsletter.py ${{ inputs.date && format('--date {0}', inputs.date) || '' }}

      - name: Commit and push
        if: steps.due.outputs.go == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "daily-news-for-kids[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "Nothing changed — the edition was already published."
            exit 0
          fi
          git commit -m "Edition for ${{ steps.due.outputs.date }}"

          # Runs overlap — a manual one and the hourly one, or a slow one and
          # the next hour — and when they do, both have rewritten the same
          # generated files under docs/. A plain `pull --rebase` stops on that
          # conflict and leaves the tree mid-rebase, which is worse than the
          # conflict: every later attempt dies on "you have unmerged files"
          # before it reaches the push, so the retries spin and a finished
          # edition is thrown away after it has already been paid for.
          #
          # docs/ is generated from data/, so a disagreement there is not a
          # disagreement about anything: keep this run's side, then render
          # again so the published files match whatever data/ ended up holding
          # — including an edition this run never saw.
          for attempt in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"

            if ! git merge -X ours "origin/${GITHUB_REF_NAME}" --no-edit; then
              git merge --abort || true
              echo "Merge failed, retry $attempt" >&2
              sleep $((2 ** attempt))
              continue
            fi

            python3 scripts/render_site.py
            git add docs
            git diff --cached --quiet || \
              git commit -m "Re-render after merging ${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed, retry $attempt" >&2
            sleep $((2 ** attempt))
          done
          echo "Could not push after 4 attempts" >&2
          exit 1

      # Both of the allowed-to-fail steps are reported here, after the edition
      # is safely committed, so the run still goes red and nothing is silent.
      - name: Surface a failed step
        if: steps.send.outcome == 'failure' || steps.poster.outcome == 'failure'
        run: |
          if [ "${{ steps.poster.outcome }}" = "failure" ]; then
            echo "The edition was built and pushed, but the share images did not." >&2
            echo "The page will be missing its share-image link until the next run." >&2
          fi
          if [ "${{ steps.send.outcome }}" = "failure" ]; then
            echo "The edition was built and pushed, but the newsletter did not go out." >&2
          fi
          exit 1
