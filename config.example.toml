# Daily News for Kids — copy this to config.toml and make it yours.
# Easier: open docs/setup.html in a browser, or run `python3 scripts/setup.py`.

[child]
# Shown as "made for ___" on the page. Leave empty to omit.
name = ""
# 5-18. Changes how the news is written: sentence length, how much gets
# explained, and how hard the dinner questions are. Never changes how serious
# the news itself is allowed to be.
age = 12

[edition]
# Stories per day, 3-10. More than 10 stops being a digest.
count = 3

# Beats to draw from. Pick as many as you like:
#   politics  society  business  tech  science
#   environment  sports  arts  health  education
categories = ["politics", "society", "business", "tech"]

# Where to focus. Pick as many as you like:
#   US  CN  CA  EU  JPKR  ANZ  SEA  SASIA  LATAM  MEA
# Or ["GLOBAL"], which means all of them. Genuinely huge news elsewhere still
# gets in either way.
regions = ["US", "CN"]

# "en", "zh", or both. The first one is what the page opens in.
languages = ["en"]

[schedule]
# Any IANA zone: America/Vancouver, America/New_York, Europe/London,
# Asia/Shanghai, Asia/Tokyo, Australia/Sydney ...
timezone = "America/Vancouver"
# Hour of day, 0-23, in the zone above. Each edition covers the 24 hours ending
# at this time. 17 = 5 PM, in time for dinner.
hour = 17

[site]
# Your GitHub Pages address. The QR code on the share image points here.
url = ""
