# Daily News for Kids — your settings.
# Easier than editing this by hand: open docs/setup.html in a browser,
# or run `python3 scripts/setup.py`.

[child]
# Shown as "made for ___" on the page. Leave empty to omit.
name = ""
# 5-18. Only decides which of the two reading levels the page opens on.
age = 12

[edition]
# The edition is written once, in English.
languages = ["en"]

[schedule]
# Any IANA zone: America/Vancouver, America/New_York, Europe/London,
# Asia/Shanghai, Asia/Tokyo, Australia/Sydney ...
timezone = "America/Vancouver"
# Hour of day, 0-23, in the zone above. Each edition covers the 24 hours ending
# at this time.
#
# Set this several hours before you actually want to read it. The job runs
# hourly, but GitHub's scheduler is best-effort: it drifts, and it sometimes
# skips an hour entirely. A cutoff at the moment you want the paper leaves no
# room for that; a cutoff at noon for a paper read at dinner leaves five hours.
hour = 12

[site]
# Your GitHub Pages address. The QR code on the share image points here.
url = ""

# Not settings, on purpose: three stories a day, from politics, society,
# business, tech and science, centred on the US and China plus anything too big
# to belong to one country. That is the editorial line, the same for everyone.
